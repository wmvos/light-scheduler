<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Scheduler</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --accent: #0f3460;
      --text: #e0e0e0;
      --highlight: #e94560;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--highlight);
    }

    .status-panel {
      background: var(--surface);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--accent);
    }

    .status-row:last-child { border-bottom: none; }

    .timeline {
      background: var(--surface);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .timeline-bar {
      height: 40px;
      background: var(--accent);
      border-radius: 4px;
      position: relative;
      margin: 10px 0;
    }

    .keyframe-marker {
      position: absolute;
      top: -5px;
      width: 3px;
      height: 50px;
      background: var(--highlight);
      transform: translateX(-50%);
    }

    .keyframe-label {
      position: absolute;
      top: 50px;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text);
    }

    .info {
      text-align: center;
      padding: 10px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Light Scheduler</h1>

  <div class="status-panel">
    <div class="status-row">
      <span>Light:</span>
      <span id="light-id">—</span>
    </div>
    <div class="status-row">
      <span>Schedule:</span>
      <span id="schedule-name">—</span>
    </div>
    <div class="status-row">
      <span>Powered:</span>
      <span id="powered">—</span>
    </div>
    <div class="status-row">
      <span>Brightness:</span>
      <span id="brightness">—</span>
    </div>
    <div class="status-row">
      <span>Color Temp:</span>
      <span id="color-temp">—</span>
    </div>
  </div>

  <div class="timeline">
    <h3>Current Schedule</h3>
    <div class="timeline-bar" id="timeline-bar">
      <!-- Keyframe markers injected here -->
    </div>
  </div>

  <div class="info">Auto-refreshes every 5 seconds</div>

  <script>
    async function refresh() {
      try {
        const resp = await fetch('/api/state');
        const state = await resp.json();

        document.getElementById('light-id').textContent = state.light_id;
        document.getElementById('schedule-name').textContent = state.schedule_name;
        document.getElementById('powered').textContent = state.powered ? 'Yes' : 'No';
        document.getElementById('brightness').textContent = state.brightness || '—';
        document.getElementById('color-temp').textContent = state.color_temp || '—';

        const bar = document.getElementById('timeline-bar');
        bar.innerHTML = '';
        state.keyframes.forEach(kf => {
          const [h, m] = kf.time.split(':').map(Number);
          const pct = ((h * 60 + m) / 1440) * 100;
          const marker = document.createElement('div');
          marker.className = 'keyframe-marker';
          marker.style.left = pct + '%';
          marker.title = kf.id + ' ' + kf.time;
          const label = document.createElement('div');
          label.className = 'keyframe-label';
          label.style.left = pct + '%';
          label.textContent = kf.time;
          bar.appendChild(marker);
          bar.appendChild(label);
        });
      } catch (e) {
        console.error('Failed to fetch state:', e);
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
