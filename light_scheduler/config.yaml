{
  "name": "Light Scheduler",
  "version": "0.2.0",
  "slug": "light_scheduler",
  "description": "Schedule brightness and color temperature for your lights",
  "arch": ["aarch64", "armv7", "armhf", "x86_64", "amd64"],
  "startup": "services",
  "boot": "auto",
  "init": false,
  "ingress": true,
  "panel_icon": "mdi:lightbulb",
  "map": ["config:rw"],
  "homeassistant_api": true,
  "long_lived_tokens": true,
  "options": {
    "light": "",
    "tick_interval": 30
  },
  "schema": {
    "light": "entity(light.*)",
    "tick_interval": "int(10,60)"
  }
}
