# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Light Scheduler
version: "0.1.1"
slug: light_scheduler
description: Schedule on/off, brightness and color temperature of your lights on a visual daily/weekly timeline.
url: "https://github.com/wmvos/light-scheduler/tree/main/light_scheduler"
arch:
  - aarch64
  - amd64
init: false
startup: application
map:
  - data:rw
options:
  light: ""
schema:
  light: "str?"
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:led-strip-variant
panel_title: Light Scheduler
panel_admin: true
